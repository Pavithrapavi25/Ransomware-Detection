<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result | Ransomware Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #06b6d4;
      --primary-dark: #0891b2;
      --secondary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --bg-primary: #0a0e27;
      --bg-secondary: #111827;
      --surface: #1f2937;
      --surface-light: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
    }
    
    body {
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }
    
    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes scale-in {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .animate-slide-up {
      animation: slide-up 0.6s ease-out;
    }
    
    .animate-scale-in {
      animation: scale-in 0.5s ease-out;
    }
    
    .glass-card {
      background: rgba(31, 41, 55, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.2);
    }
    
    .status-badge {
      position: relative;
      overflow: hidden;
    }
    
    .status-badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      100% { left: 100%; }
    }
    
    .result-image {
      transition: transform 0.3s ease;
    }
    
    .result-image:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

  <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 w-full max-w-2xl animate-slide-up">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block p-4 bg-gradient-to-br from-cyan-500/20 to-blue-600/20 rounded-2xl mb-4 animate-scale-in">
        <svg class="w-12 h-12 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h2 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
        Analysis Complete
      </h2>
      <p class="text-gray-400 mt-2">Detection results are ready</p>
    </div>

    <!-- Results Grid -->
    <div class="grid md:grid-cols-2 gap-6 mb-8">
      
      <!-- Status Badge -->
      <div class="status-badge bg-gradient-to-br {% if label == 'Malicious' %}from-red-500/20 to-red-600/10 border-2 border-red-500/50{% elif label == 'Benign' %}from-green-500/20 to-green-600/10 border-2 border-green-500/50{% else %}from-yellow-500/20 to-yellow-600/10 border-2 border-yellow-500/50{% endif %} rounded-2xl p-6 text-center">
        <p class="text-sm text-gray-400 mb-2 uppercase tracking-wider font-semibold">Classification</p>
        <div class="flex items-center justify-center gap-2 mb-2">
          {% if label == 'Malicious' %}
            <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
          {% elif label == 'Benign' %}
            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          {% endif %}
        </div>
        <p class="text-3xl font-bold {% if label == 'Malicious' %}text-red-400{% elif label == 'Benign' %}text-green-400{% else %}text-yellow-400{% endif %}">
          {{ label }}
        </p>
      </div>
      
      <!-- Confidence Score -->
      <div class="bg-gradient-to-br from-gray-700/30 to-gray-800/30 border-2 border-gray-600/50 rounded-2xl p-6 text-center">
        <p class="text-sm text-gray-400 mb-2 uppercase tracking-wider font-semibold">Confidence Level</p>
        <div class="flex items-center justify-center gap-2 mb-2">
          <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <p class="text-3xl font-bold text-cyan-400">{{ confidence }}</p>
      </div>
      
    </div>

    <!-- Image Preview -->
    {% if image_name %}
    <div class="mb-8 bg-gray-800/50 rounded-2xl p-6 border border-gray-700">
      <p class="text-sm text-gray-400 mb-4 uppercase tracking-wider font-semibold text-center">Analyzed File</p>
      <div class="flex justify-center">
        <img src="{{ url_for('static', filename=image_name) }}" 
             class="result-image rounded-xl shadow-2xl max-w-sm w-full border-2 border-gray-600" 
             alt="Analyzed file">
      </div>
    </div>
    {% endif %}

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4">
      <a href="/" class="flex-1 group px-6 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 rounded-xl text-white font-semibold text-center transition-all duration-300 shadow-lg hover:shadow-cyan-500/50 transform hover:-translate-y-0.5">
        <span class="flex items-center justify-center gap-2">
          <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Analyze Another File
        </span>
      </a>
      
      <button onclick="window.print()" class="flex-1 px-6 py-4 bg-gray-700 hover:bg-gray-600 rounded-xl text-white font-semibold text-center transition-all duration-300 border border-gray-600">
        <span class="flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
          </svg>
          Download Report
        </span>
      </button>
    </div>
    
  </div>

</body>
</html>
